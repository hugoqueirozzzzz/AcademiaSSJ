{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Treino{% endblock %}


{% block body %}


<div class="container">
    <br>
    <form method="POST" enctype="multipart/form-data"
        action="{% if treino %}{% url 'academia_modulo:treino_edit' treino.id %}{% else %}{% url 'academia_modulo:cadastrar_treino' %}{% endif %}">

        {% csrf_token %}
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonAluno">Aluno</span>
            <select class="form-select" name="aluno" aria-describedby="basic-addonAluno" required>
                <option value="">Selecione o aluno</option>
                {% for aluno in alunos %}
                <option value="{{ aluno.id }}" {% if treino and treino.aluno.id==aluno.id %}selected{% endif %}>
                    {{ aluno.nome }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonIdade">Idade</span>
            <input type="text" class="form-control" name="idade" placeholder="Digite a idade" aria-label="Idade"
                aria-describedby="basic-addonIdade" value="{{ treino.idade|default:'' }}">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonAltura">Altura (cm)</span>
            <input type="text" class="form-control" id="altura" name="altura"
                placeholder="Digite a altura em cm. Exemplo 175" aria-label="Altura"
                aria-describedby="basic-addonAltura" value="{{ treino.altura|default:'' }}">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonPeso">Peso (kg)</span>
            <input type="text" class="form-control" id="peso" name="peso" placeholder="Digite o peso. Exemplo 70"
                aria-label="Peso" aria-describedby="basic-addonPeso" value="{{ treino.peso|default:'' }}">
        </div>

        <div class="input-group mb-2">
            <span class="input-group-text" id="basic-addonIMC">IMC</span>
            <input type="text" class="form-control" id="imc" name="imc" placeholder="Calculado automaticamente"
                aria-label="IMC" aria-describedby="basic-addonIMC" value="{{ treino.imc|default:'' }}" readonly>
        </div>
        <div id="imc-classificacao" class="alert py-2 mb-3" style="display: none;"></div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonFicha">Ficha de Treino</span>
            <select class="form-select" name="ficha_de_treino" aria-describedby="basic-addonFicha" required>
                <option value="">Selecione a ficha de treino</option>
                {% for ficha in fichas %}
                <option value="{{ ficha.id }}" {% if treino and treino.ficha_de_treino.id==ficha.id %}selected{% endif
                    %}>
                    {{ ficha.tipo }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="input-group mb-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
</div>

</form>


<script>
    (function () {
        const alturaEl = document.getElementById('altura');
        const pesoEl = document.getElementById('peso');
        const imcEl = document.getElementById('imc');
        const classEl = document.getElementById('imc-classificacao');

        function classificar(imc) {
            if (imc < 18.5) return ['Abaixo do peso', 'alert-warning'];
            if (imc < 25) return ['Peso normal', 'alert-success'];
            if (imc < 30) return ['Sobrepeso', 'alert-warning'];
            if (imc < 35) return ['Obesidade grau I', 'alert-danger'];
            if (imc < 40) return ['Obesidade grau II', 'alert-danger'];
            return ['Obesidade grau III', 'alert-danger'];
        }

        function calcular() {
            let altura = parseFloat(alturaEl.value.replace(',', '.'));
            const peso = parseFloat(pesoEl.value.replace(',', '.'));

            if (altura > 3) altura = altura / 100;

            if (!(altura > 0) || !(peso > 0)) {
                imcEl.value = '';
                classEl.style.display = 'none';
                return;
            }

            const imc = peso / (altura * altura);
            const [texto, classe] = classificar(imc);

            imcEl.value = imc.toFixed(2);
            classEl.className = 'alert ' + classe + ' py-2 mb-3';
            classEl.textContent = texto;
            classEl.style.display = 'block';
        }

        alturaEl.addEventListener('input', calcular);
        pesoEl.addEventListener('input', calcular);

        calcular();
    })();
</script>
</div>
</div>





{% endblock %}
