{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body>

    <!-- Barra de navegação, navbar, ainda tenho que editar os nomes dos elementos -->
  <nav class="navbar sticky-top navbar-light bg-warning navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'academia_modulo:home' %}">Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
         <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Alunos
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'academia_modulo:cadastrar_aluno' %}">Cadastrar Aluno</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{% url 'academia_modulo:listar_alunos' %}">Listar Alunos</a></li>
          </ul>
        </li>
         <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Treinos
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'academia_modulo:cadastrar_treino' %}">Cadastrar Treino</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{% url 'academia_modulo:listar_treinos' %}">Listar Treinos</a></li>
          </ul>
        </li>
        
    </div>
  </div>
</nav>
 
{% block body %}{% endblock %}
{% block footer %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
