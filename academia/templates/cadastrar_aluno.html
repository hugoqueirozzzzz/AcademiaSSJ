{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Aluno{% endblock %}

{% block body %}
<div class="container">
    <br>
    <form method="POST" enctype="multipart/form-data" action="{% if aluno %}{% url 'academia_modulo:aluno_edit' aluno.id %}{% else %}{% url 'academia_modulo:cadastrar_aluno' %}{% endif %}">
        
        {% csrf_token %}    
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonNome">Nome</span>
            <input type="text" class="form-control" name="nome" placeholder="Nome" aria-label="Nome" aria-describedby="basic-addonNome" value="{{ aluno.nome|default:'' }}">
        </div>   <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonEndereco">Endereco</span>
            <input type="text" class="form-control" name="endereco" placeholder="Endereco" aria-label="Endereco" aria-describedby="basic-addonEndereco" value="{{ aluno.endereco|default:'' }}">
        </div>
    <div class="row">
        <div class="col">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addonCPF">CPF</span>
                <input type="text" class="form-control" name="cpf" placeholder="CPF" aria-label="CPF" aria-describedby="basic-addonCPF" value="{{ aluno.cpf|default:'' }}">
            </div>
        </div>
        <div class="col">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addonPlano">Plano</span>
                <input type="text" class="form-control" name="plano" placeholder="Plano" aria-label="Plano" aria-describedby="basic-addonPlano" value="{{ aluno.plano|default:'' }}">
            </div>
        </div>
        <div class="col">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addonTelefone">Telefone</span>
                <input type="text" class="form-control" name="telefone" placeholder="Telefone" aria-label="Telefone" aria-describedby="basic-addonTelefone" value="{{ aluno.telefone|default:'' }}">
            </div>
        </div>
    </div>

        <div class="row">
            <div class="col">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="E-mail" aria-label="E-mail" name ="email" aria-describedby="basic-addonEmail" value="{{ aluno.email|default:'' }}">
                    <span class="input-group-text" id="basic-addonEmail">@example.com</span>
                </div>
            </div>
            <div class="col">
                <div class="input-group mb-3">
                    <input type="date" class="form-control" name="nascimento" placeholder="Nascimento" aria-label="Nascimento" aria-describedby="basic-addonNascimento" value="{{ aluno.nascimento|default:'' }}">
                    <span class="input-group-text" id="basic-addonNascimento">DD/MM/AAAA</span>
                </div>
            </div>
        </div>
    
     <select class="form-select" aria-label="Forma de pagamento" name="forma_pagamento" required>
            <option value="" {% if not aluno.forma_pagamento %}selected{% endif %}>Selecione a forma de pagamento</option>
            <option value="DINHEIRO" {% if aluno.forma_pagamento == 'DINHEIRO' %}selected{% endif %}>Dinheiro</option>
            <option value="CARTAO" {% if aluno.forma_pagamento == 'CARTAO' %}selected{% endif %}>Cartão de Crédito</option>
            <option value="PIX" {% if aluno.forma_pagamento == 'PIX' %}selected{% endif %}>Pix</option>
            </select>
 <br><br>
<div class="input-group mb-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
  </div>
</div>

   <br><br>
        

        
</div>

    </form>
</div>

{% endblock %}
